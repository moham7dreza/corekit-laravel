# .gitlab/ci/deploy/staging.yml
# ============================================================
# Deploy to Staging
# ============================================================

deploy-staging:
  stage: deploy
  image: alpine:latest
  variables:
    STAGING_SERVER_IP: $STAGING_SERVER_IP
    STAGING_SSH_USER: $STAGING_SSH_USER
    APP_PATH: /var/www/staging
  script:
    - apk add --no-cache openssh-client openssl
    - eval $(ssh-agent -s)
    - echo "$STAGING_SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $STAGING_SERVER_IP >> ~/.ssh/known_hosts

    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && git pull origin develop"

    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && composer install --no-dev --optimize-autoloader"
    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && npm ci --production"
    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && npm run build"

    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && php artisan migrate --force"
    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && php artisan config:cache"
    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && php artisan route:cache"
    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && php artisan view:cache"
    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && php artisan event:cache"
    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && php artisan filament:cache"

    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && php artisan queue:restart"
    - ssh $STAGING_SSH_USER@$STAGING_SERVER_IP "cd $APP_PATH && nohup php artisan schedule:work > /dev/null 2>&1 &"

    - echo "Deploy to staging completed!"
  environment:
    name: staging
    url: https://staging.yourdomain.com
  only:
    - develop
  when: manual
  tags:
    - docker
