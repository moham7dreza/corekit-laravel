# .gitlab/ci/build/assets.yml
# ============================================================
# React Assets Build
# ============================================================

assets-build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - public/build/
      - public/hot
    expire_in: 1 week
  only:
    - master
    - develop
  tags:
    - docker
